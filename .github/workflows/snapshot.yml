name: Snapshot build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: snapshot-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Fork PRs cannot use the Unity account secrets required for activation.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: Player / ${{ matrix.platform }}
    strategy:
      fail-fast: false
      # Avoid concurrent activations of the same Unity account.
      max-parallel: 1
      matrix:
        include:
          - os: windows-2022
            platform: Windows
            player: UnitySample.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      RECORDER_REVISION: 679208f2446189c4842b560c39ff0bf8cf1f1eb7
    defaults:
      run:
        shell: bash
        working-directory: UnitySample

    steps:
      - name: Check out sample
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: UnitySample
          persist-credentials: false

      - name: Check out recorder dependency
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: UnityRuntimeCameraRecorder/UnityRuntimeCameraRecorder
          ref: ${{ env.RECORDER_REVISION }}
          path: UnityRuntimeCameraRecorder
          persist-credentials: false

      - name: Check Unity activation configuration
        env:
          UNITY_USERNAME: ${{ secrets.UNITY_USERNAME }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          if [[ -z "$UNITY_USERNAME" || -z "$UNITY_PASSWORD" ]]; then
              printf '%s\n' 'Configure UNITY_USERNAME and UNITY_PASSWORD in repository Actions secrets.' >&2
              exit 1
          fi

      - name: Set up Unity
        id: unity
        uses: buildalon/unity-setup@30fcbcb56c10ea5d64298e970d952b8d29bc268b # v2
        with:
          version-file: UnitySample/ProjectSettings/ProjectVersion.txt

      - name: Validate Unity editor installation
        shell: pwsh
        run: |
          $required = 'C:\Program Files\Unity\Hub\Editor\6000.0.61f1\Editor\Unity.dll'
          if (-not (Test-Path -LiteralPath $required)) {
              throw "Unity setup is incomplete: $required is missing."
          }

      # The action returns its license in the post step, including on build failure.
      - name: Activate Unity Personal license
        uses: buildalon/activate-unity-license@e0d245d0787b7b9931b56ccbde3b508f6b70f1af # v2
        with:
          license: personal
          username: ${{ secrets.UNITY_USERNAME }}
          password: ${{ secrets.UNITY_PASSWORD }}

      - name: Build player without launching
        env:
          UNITY_EXECUTABLE: ${{ steps.unity.outputs.unity-editor-path }}
        run: bash ./build.sh

      - name: Package snapshot
        shell: pwsh
        env:
          SNAPSHOT_PLATFORM: ${{ matrix.platform }}
          SNAPSHOT_PLAYER: ${{ matrix.player }}
        run: |
          $output = Join-Path 'Builds' $env:SNAPSHOT_PLATFORM
          $player = Join-Path $output $env:SNAPSHOT_PLAYER
          if (-not (Test-Path -LiteralPath $player)) {
              throw "The built player is missing: $player"
          }
          foreach ($dependency in 'UnityRuntimeCameraRecorder.dll', 'FFmpegMediaWriter.dll') {
              if (-not (Get-ChildItem -LiteralPath $output -Filter $dependency -File -Recurse)) {
                  throw "The player does not include dependency: $dependency"
              }
          }
          if ($env:SNAPSHOT_PLATFORM -eq 'Windows' -and -not (Get-ChildItem -LiteralPath $output -Filter 'Direct3DVideoEncoder.dll' -File -Recurse)) {
              throw 'The Windows player does not include dependency: Direct3DVideoEncoder.dll'
          }
          Copy-Item -LiteralPath 'LICENSE', 'README.md' -Destination $output
          $hashes = [ordered]@{}
          $outputPath = (Resolve-Path -LiteralPath $output).Path
          foreach ($file in Get-ChildItem -LiteralPath $outputPath -File -Recurse) {
              $relative = [IO.Path]::GetRelativePath($outputPath, $file.FullName).Replace('\', '/')
              $hashes[$relative] = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash
          }
          $version = (Select-String -LiteralPath 'ProjectSettings/ProjectVersion.txt' -Pattern '^m_EditorVersion: ').Line.Split(':', 2)[1].Trim()
          [ordered]@{
              kind = 'snapshot'
              commit = (git rev-parse HEAD)
              unityVersion = $version
              platform = $env:SNAPSHOT_PLATFORM
              run = $env:GITHUB_RUN_ID
              attempt = $env:GITHUB_RUN_ATTEMPT
              builtUtc = [DateTime]::UtcNow.ToString('O')
              fileSha256 = $hashes
          } | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath (Join-Path $output 'build-info.json') -Encoding utf8
          $snapshot = 'Builds/Snapshots'
          New-Item -ItemType Directory -Path $snapshot -Force | Out-Null
          Compress-Archive -Path "$output/*" -DestinationPath "$snapshot/UnitySample-1.0.0-snapshot-Windows.zip" -Force

      - name: Upload snapshot
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: UnitySample-snapshot-${{ matrix.platform }}-${{ github.sha }}-${{ github.run_attempt }}
          path: UnitySample/Builds/Snapshots/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: UnitySample-build-log-${{ matrix.platform }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: UnitySample/Builds/Logs/build.log
          if-no-files-found: ignore
          retention-days: 30

      - name: Publish snapshot prerelease
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          SNAPSHOT_TAG: 1.0.0-snapshot
          SNAPSHOT_PLATFORM: ${{ matrix.platform }}
        run: |
          tag_reference="repos/$GITHUB_REPOSITORY/git/refs/tags/$SNAPSHOT_TAG"
          if ! gh api --method PATCH "$tag_reference" -f sha="$GITHUB_SHA" -F force=true >/dev/null 2>&1; then
              gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$SNAPSHOT_TAG" -f sha="$GITHUB_SHA"
          fi
          cat > release-notes.md <<'EOF'
          ## Unity Runtime Camera Recorder — Windows snapshot

          This is a ready-to-run Windows demo of **UnityRuntimeCameraRecorder**. It demonstrates real-time recording of Unity cameras and the rendered application using NVIDIA hardware encoding, with configurable resolution, frame rate, codec, quality, and MSAA.

          ### Requirements

          - Windows 10 or 11, 64-bit
          - An NVIDIA GPU supporting NVENC hardware encoding
          - NVIDIA display driver 610.00 or newer (required by NVENC API 13.1)
          - FFmpeg and FFprobe

          To check your GPU, run `nvidia-smi` in Command Prompt and find its model in the [NVIDIA Video Encode and Decode GPU Support Matrix](https://developer.nvidia.com/video-encode-and-decode-gpu-support-matrix-new). Check that `H.264 (AVC) YUV 4:2:0` is `YES` for H.264 recording, or that `H.265 (HEVC) 4K YUV 4:2:0` is `YES` for HEVC recording up to 4K. `Max # of concurrent sessions` must also be at least the number of videos you want to record simultaneously.

          ### How to run it

          1. Download and extract `UnitySample-1.0.0-snapshot-Windows.zip`.
          2. FFmpeg is not included in the archive. Download and extract [FFmpeg](https://ffmpeg.org/download.html).
          3. Set `FFMPEG_PATH` to the FFmpeg `bin` directory containing both `ffmpeg.exe` and `ffprobe.exe`.
          4. Launch `UnitySample.exe`.

          Recordings are written to the `output` directory next to the application.

          EOF
          printf '\nBuilt from commit [`%s`](https://github.com/%s/commit/%s).\n' "$GITHUB_SHA" "$GITHUB_REPOSITORY" "$GITHUB_SHA" >> release-notes.md
          if gh release view "$SNAPSHOT_TAG" >/dev/null 2>&1; then
              gh release edit "$SNAPSHOT_TAG" --title "$SNAPSHOT_TAG" --prerelease --notes-file release-notes.md
          else
              gh release create "$SNAPSHOT_TAG" --title "$SNAPSHOT_TAG" --prerelease --notes-file release-notes.md
          fi
          while IFS= read -r previous_asset; do
              if [[ -n "$previous_asset" ]]; then
                  gh release delete-asset "$SNAPSHOT_TAG" "$previous_asset" --yes
              fi
          done < <(gh release view "$SNAPSHOT_TAG" --json assets --jq '.assets[].name')
          asset=(Builds/Snapshots/UnitySample-1.0.0-snapshot-"$SNAPSHOT_PLATFORM".*)
          if [[ ${#asset[@]} -ne 1 || ! -f "${asset[0]}" ]]; then
              printf 'Expected one snapshot archive for %s.\n' "$SNAPSHOT_PLATFORM" >&2
              exit 1
          fi
          gh release upload "$SNAPSHOT_TAG" "${asset[0]}" --clobber
